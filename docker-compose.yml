name: marveen

services:
  marveen:
    build:
      context: .
      dockerfile: Dockerfile
    image: marveen:local
    container_name: marveen
    restart: unless-stopped
    # Docker-provided init as a second safety net alongside the image's tini.
    init: true
    env_file:
      - .env.docker
    environment:
      # NOTE: the app reads its OWN config knobs (WEB_HOST, WEB_PORT,
      # MAIN_AGENT_ID, ...) from the /app/.env FILE (src/env.ts readEnvFile),
      # NOT from these process-env vars. So WEB_HOST etc. are set in the
      # mounted .env.docker below (-> /app/.env), not here. These process-env
      # vars are only for things read via process.env directly (the claude CLI
      # token, OS timezone). WEB_HOST=0.0.0.0 in .env.docker is REQUIRED for the
      # published port to be reachable from the host (app default 127.0.0.1 =
      # container loopback only; the container network is isolated and /api/*
      # stays behind the Bearer token gate).
      #
      # Relocate the app's .env onto the PERSISTENT store volume so dashboard
      # onboarding/settings survive container recreates (the entrypoint seeds it
      # from .env.docker and symlinks /app/.env -> it for shell-side readers).
      CLAUDECLAW_ENV_DIR: /app/store
      TZ: ${TZ:-Europe/Budapest}
    ports:
      - "${WEB_PORT:-3420}:${WEB_PORT:-3420}"
    volumes:
      # The app reads AND writes its config at /app/.env (src/env.ts). It does
      # NOT fall back to process.env, so env_file/environment values alone never
      # reach config.ts. Mount .env.docker as a read-only SEED; the entrypoint
      # copies it to a writable /app/.env on boot (a single-file bind mount
      # can't be written via the app's atomic-rename path). WEB_HOST, WEB_PORT,
      # MAIN_AGENT_ID, etc. set in .env.docker thus take effect, and the
      # dashboard onboarding/settings can persist changes to /app/.env.
      - ./.env.docker:/app/.env.seed:ro
      # Persistent runtime state (all gitignored, never baked into the image).
      # store/ contains the SQLite DB (store/claudeclaw.db), tokens and settings.
      - marveen-store:/app/store
      - marveen-agents:/app/agents
      - marveen-workspace:/app/workspace
      - marveen-reports:/app/reports
      - marveen-channels:/app/.channels-config
      - marveen-mcp:/app/mcp-servers
      # Alternative to baking/env tokens: mount host Claude auth read-only.
      # - ${HOME}/.claude:/home/node/.claude:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${WEB_PORT:-3420}/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  # Optional local-LLM offload target (the Ollama offload feature).
  # Enable with:  docker compose --profile ollama up -d
  # then set OLLAMA_URL=http://ollama:11434 in .env.docker.
  ollama:
    image: ollama/ollama:latest
    container_name: marveen-ollama
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    # Uncomment to expose the Ollama API on the host:
    # ports:
    #   - "11434:11434"

volumes:
  marveen-store:
  marveen-agents:
  marveen-workspace:
  marveen-reports:
  marveen-channels:
  marveen-mcp:
  ollama-models:
